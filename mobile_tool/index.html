<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YATRA 2026 | On-Spot Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');

        body {
            font-family: 'Outfit', sans-serif;
        }

        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body class="bg-black text-white min-h-screen flex flex-col items-center justify-center p-4">

    <!-- PIN Screen -->
    <div id="pinScreen" class="w-full max-w-sm">
        <div class="text-center mb-8">
            <h1
                class="text-4xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-600">
                YATRA 2026</h1>
            <p class="text-gray-400 mt-2 tracking-widest text-xs uppercase">On-Spot Registration Console</p>
        </div>

        <div class="glass p-8 rounded-2xl shadow-2xl">
            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Admin Access PIN</label>
            <input type="password" id="pinInput" placeholder="Enter PIN"
                class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-center text-2xl tracking-widest focus:outline-none focus:border-purple-500 transition-colors placeholder-gray-800">
            <button onclick="verifyPin()"
                class="w-full mt-6 bg-white text-black font-bold py-3 rounded-xl hover:bg-gray-200 transition-colors uppercase tracking-wider">
                Access System
            </button>
            <p id="pinError" class="text-red-500 text-xs text-center mt-4 hidden">Invalid PIN. Access Denied.</p>
        </div>
    </div>

    <!-- Registration Screen -->
    <div id="regScreen" class="hidden w-full max-w-md">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold">New Registration</h2>
            <button onclick="logout()"
                class="text-xs text-gray-500 hover:text-white uppercase tracking-wider">Logout</button>
        </div>

        <div class="glass p-6 rounded-2xl border-t-4 border-purple-500">
            <form id="regForm" onsubmit="handleRegister(event)" class="space-y-4">

                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Full Name</label>
                    <input type="text" name="name" required
                        class="w-full bg-gray-900 border border-gray-800 rounded-lg px-4 py-3 focus:outline-none focus:border-purple-500 transition-colors">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Email Address</label>
                    <input type="email" name="email" required
                        class="w-full bg-gray-900 border border-gray-800 rounded-lg px-4 py-3 focus:outline-none focus:border-purple-500 transition-colors">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Phone Number</label>
                    <input type="tel" name="phone" required
                        class="w-full bg-gray-900 border border-gray-800 rounded-lg px-4 py-3 focus:outline-none focus:border-purple-500 transition-colors">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">College Name</label>
                    <input type="text" name="college" required
                        class="w-full bg-gray-900 border border-gray-800 rounded-lg px-4 py-3 focus:outline-none focus:border-purple-500 transition-colors">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Amount (₹)</label>
                        <input type="number" name="amount" value="300" required
                            class="w-full bg-gray-900 border border-gray-800 rounded-lg px-4 py-3 focus:outline-none focus:border-purple-500 transition-colors font-mono">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Mode</label>
                        <select name="payment_mode"
                            class="w-full bg-gray-900 border border-gray-800 rounded-lg px-4 py-3 focus:outline-none focus:border-purple-500 transition-colors appearance-none">
                            <option value="Cash">Cash</option>
                            <option value="UPI">UPI</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="pt-4">
                    <button type="submit" id="submitBtn"
                        class="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white font-bold py-4 rounded-xl hover:opacity-90 transition-opacity uppercase tracking-wider shadow-lg shadow-purple-900/20">
                        Process & Send Ticket
                    </button>
                </div>

            </form>
        </div>

        <div id="statusMessage" class="mt-6 text-center text-sm font-mono text-gray-400 hidden"></div>
    </div>

    <script>
        // Supabase Function URL - derived from your environment
        const FUNCTION_URL = "https://mnboyuyajxghqbbkdqhi.supabase.co/functions/v1/on-spot-register";

        let ADMIN_PIN = "";

        function verifyPin() {
            const input = document.getElementById('pinInput').value;
            // Basic client-side check effectively, real check is on server
            // But here we just store it to send with request
            if (input.length >= 4) {
                ADMIN_PIN = input;
                document.getElementById('pinScreen').classList.add('hidden');
                document.getElementById('regScreen').classList.remove('hidden');
            } else {
                document.getElementById('pinError').classList.remove('hidden');
            }
        }

        function logout() {
            ADMIN_PIN = "";
            document.getElementById('pinInput').value = "";
            document.getElementById('regScreen').classList.add('hidden');
            document.getElementById('pinScreen').classList.remove('hidden');
        }

        async function handleRegister(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const status = document.getElementById('statusMessage');

            btn.disabled = true;
            btn.innerText = "Processing...";
            btn.classList.add('opacity-50', 'cursor-not-allowed');
            status.classList.remove('hidden');
            status.innerText = "Connecting to secure server...";
            status.className = "mt-6 text-center text-sm font-mono text-blue-400 animate-pulse";

            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            data.pin = ADMIN_PIN; // Attach PIN for server verification

            try {
                const response = await fetch(FUNCTION_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    status.innerText = "SUCCESS! Ticket Sent.";
                    status.className = "mt-6 text-center text-sm font-mono text-green-400";
                    e.target.reset(); // Clear form
                    // Reset amount to default
                    e.target.amount.value = "300";

                    // Show success checkmark briefly via alert or proper UI
                    setTimeout(() => {
                        alert(`Success!\nTicket sent to ${data.email}\nStatus: ${result.message}`);
                        status.classList.add('hidden');
                    }, 100);

                } else {
                    throw new Error(result.error || "Request failed");
                }

            } catch (error) {
                console.error(error);
                status.innerText = "ERROR: " + error.message;
                status.className = "mt-6 text-center text-sm font-mono text-red-400";
                if (error.message === "Invalid Admin PIN") {
                    setTimeout(logout, 2000);
                }
            } finally {
                btn.disabled = false;
                btn.innerText = "Process & Send Ticket";
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }
    </script>
</body>

</html>
