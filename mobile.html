    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"

    />

    <!-- Performance: preload hero visuals used above-the-fold -->
    <link rel="preload" as="image" href="/src/mobile/assets/optimized/herobg-w1280.webp" />
    <link rel="preload" as="image" href="/src/mobile/assets/optimized/yatratxt-w1536.webp" />

    <link rel="preload" as="image" href="/src/mobile/assets/optimized/2026txt-w1536.webp" />

    <!-- Critical CSS (avoid white flash while JS boots) -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #160018;
      }
      #root {
        min-height: 100svh;
      }
    </style>

    <!-- Auto-switch to PC (desktop) version for iPad mini+ -->
    <script>
      (function () {
        // Allow explicit opt-in to mobile via ?mobile=true
        const urlParams = new URLSearchParams(window.location.search);
        const forceMobile = urlParams.get('mobile') === 'true';
        if (forceMobile) return;

        // Only allow the mobile experience for specific phone-sized viewports
        // (matches iPhone SE/XR/12 Pro/14 Pro Max, Pixel 7, Galaxy S8+/S20 Ultra/A52/71 and close variants).
        const MOBILE_MIN_SHORT_SIDE = 360;
        const MOBILE_MAX_SHORT_SIDE = 430;
        const userAgent = (navigator.userAgent || navigator.vendor || window.opera || '').toLowerCase();
        const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
        const shortSide = Math.min(window.innerWidth, window.innerHeight);
        const isAllowedSize = shortSide >= MOBILE_MIN_SHORT_SIDE && shortSide <= MOBILE_MAX_SHORT_SIDE;
        const isIPhoneOrIPod = /iphone|ipod/i.test(userAgent);
        const isAndroidPhone = /android/i.test(userAgent) && /mobile/i.test(userAgent);
        const isOtherPhone = /webos|blackberry|iemobile|opera mini/i.test(userAgent);
        const isPhone = isTouchDevice && isAllowedSize && (isIPhoneOrIPod || isAndroidPhone || isOtherPhone);

        // If this isn't a phone-sized mobile device, go to desktop version
        if (!isPhone) {
          const currentSearch = window.location.search;
          const currentHash = window.location.hash;
          window.location.replace('homepage.html' + currentSearch + currentHash);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/mobile/main.jsx"></script>
  </body>
